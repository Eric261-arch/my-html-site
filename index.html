<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Mate - Financial Management App</title>
    <meta name="description" content="Manage your finances, split bills, and track expenses with Budget Mate">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            touch-action: manipulation;
        }
        
        .gradient-bg { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
        }
        
        .glass { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .fade-in { 
            animation: fadeIn 0.3s ease-in; 
        }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .notification-dot::after { 
            content: ''; 
            position: absolute; 
            top: -2px; 
            right: -2px; 
            width: 8px; 
            height: 8px; 
            background: #ef4444; 
            border-radius: 50%; 
        }

        .btn {
            min-height: 44px;
            min-width: 44px;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            border: none;
        }

        .btn-success {
            background: #10b981;
            color: white;
            border: none;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
            border: none;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .card-mobile {
            margin-bottom: 16px;
            padding: 16px;
        }

        .grid-responsive {
            display: grid;
            gap: 16px;
            grid-template-columns: 1fr;
        }

        @media (min-width: 640px) {
            .grid-responsive {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .grid-responsive {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .form-input {
            width: 100%;
            min-height: 44px;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .offline-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #f59e0b;
            color: white;
            text-align: center;
            padding: 8px;
            z-index: 9999;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
        }

        .offline-banner.show {
            transform: translateY(0);
        }

        .shared-indicator {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .personal-indicator {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .expense-indicator {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .recurring-indicator {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .status-complete {
            background: #dcfce7;
            color: #15803d;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .status-waiting-others {
            background: #fef3c7;
            color: #92400e;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .status-waiting-you {
            background: #fecaca;
            color: #dc2626;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .status-pending {
            background: #e0e7ff;
            color: #3730a3;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .connection-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .connection-active {
            background: #dcfce7;
            color: #15803d;
        }

        .connection-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .notification-urgent {
            border-left: 4px solid #dc2626;
            background: #fef2f2;
        }

        .notification-warning {
            border-left: 4px solid #d97706;
            background: #fffbeb;
        }

        .notification-info {
            border-left: 4px solid #2563eb;
            background: #eff6ff;
        }

        .receipt-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: #f9fafb;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .receipt-item input {
            flex: 1;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 14px;
        }

        .receipt-item button {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .split-details {
            margin-top: 8px;
            padding: 8px;
            background: #f8fafc;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .split-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 0;
            font-size: 0.875rem;
        }

        .split-item.current-user {
            font-weight: 600;
            color: #1f2937;
        }

        .split-item.other-user {
            color: #6b7280;
        }

        /* Fix mobile tab overlap */
        @media (max-width: 640px) {
            .tab-container {
                overflow-x: auto;
                scrollbar-width: none;
                -ms-overflow-style: none;
            }
            
            .tab-container::-webkit-scrollbar {
                display: none;
            }
            
            .tab-list {
                display: flex;
                min-width: max-content;
                gap: 0;
            }
            
            .tab-button {
                flex-shrink: 0;
                white-space: nowrap;
                padding: 12px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div id="offline-banner" class="offline-banner">
        <span>You're offline. Changes will sync when connection is restored.</span>
    </div>
    
    <div id="app"></div>

    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://rpagbqdshrywagdnymgf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwYWdicWRzaHJ5d2FnZG55bWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgwNjc0OTIsImV4cCI6MjA3MzY0MzQ5Mn0.VKV8kHE8wwgePus2l8DoZusQa8LE3afYbUzFoxwKM2A';

        // Initialize Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Enhanced Supabase Service
        class SupabaseService {
            constructor() {
                this.isOnline = navigator.onLine;
                this.setupOfflineHandling();
                this.user = null;
                this.setupAuthListener();
                this.setupRealtimeSubscriptions();
            }

            setupAuthListener() {
                supabase.auth.onAuthStateChange((event, session) => {
                    this.user = session?.user || null;
                    if (event === 'SIGNED_OUT') {
                        this.user = null;
                        if (window.app) {
                            window.app.handleSignOut();
                        }
                    }
                });
            }

            setupRealtimeSubscriptions() {
                // Subscribe to bills changes
                supabase
                    .channel('bills-changes')
                    .on('postgres_changes', 
                        { event: '*', schema: 'public', table: 'bills' },
                        (payload) => {
                            console.log('Bills changed:', payload);
                            if (window.app && this.user) {
                                // Refresh the app when bills change
                                window.app.render();
                            }
                        }
                    )
                    .subscribe();

                // Subscribe to bill_shares changes
                supabase
                    .channel('bill-shares-changes')
                    .on('postgres_changes',
                        { event: '*', schema: 'public', table: 'bill_shares' },
                        (payload) => {
                            console.log('Bill shares changed:', payload);
                            if (window.app && this.user) {
                                // Refresh the app when bill shares change
                                window.app.render();
                            }
                        }
                    )
                    .subscribe();
            }

            setupOfflineHandling() {
                window.addEventListener('online', () => {
                    this.isOnline = true;
                    this.showOfflineBanner(false);
                });

                window.addEventListener('offline', () => {
                    this.isOnline = false;
                    this.showOfflineBanner(true);
                });
            }

            showOfflineBanner(show) {
                const banner = document.getElementById('offline-banner');
                banner.classList.toggle('show', show);
            }

            // Authentication methods
            async signUp(email, password, userData) {
                try {
                    const { data, error } = await supabase.auth.signUp({
                        email,
                        password,
                        options: {
                            data: {
                                name: userData.name
                            }
                        }
                    });

                    if (error) throw error;

                    // Create user profile
                    if (data.user) {
                        const { error: profileError } = await supabase
                            .from('users')
                            .insert([{
                                id: data.user.id,
                                email: data.user.email,
                                name: userData.name,
                                credit_score: Math.floor(Math.random() * 200) + 600,
                                settings: {
                                    private_mode: false,
                                    notifications: true,
                                    currency: 'USD',
                                    notification_timing: 3
                                }
                            }]);

                        if (profileError) throw profileError;
                    }

                    return data.user;
                } catch (error) {
                    console.error('Sign up error:', error);
                    throw error;
                }
            }

            async signIn(email, password) {
                try {
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email,
                        password
                    });

                    if (error) throw error;
                    return data.user;
                } catch (error) {
                    console.error('Sign in error:', error);
                    throw error;
                }
            }

            async signOut() {
                try {
                    const { error } = await supabase.auth.signOut();
                    if (error) throw error;
                    this.user = null;
                } catch (error) {
                    console.error('Sign out error:', error);
                    throw error;
                }
            }

            async getCurrentUser() {
                try {
                    const { data: { user } } = await supabase.auth.getUser();
                    this.user = user;
                    return user;
                } catch (error) {
                    console.error('Get user error:', error);
                    return null;
                }
            }

            async getUserProfile(userId = null) {
                try {
                    const targetUserId = userId || this.user?.id;
                    if (!targetUserId) return null;

                    const { data, error } = await supabase
                        .from('users')
                        .select('*')
                        .eq('id', targetUserId)
                        .single();

                    if (error) throw error;
                    return data;
                } catch (error) {
                    console.error('Get user profile error:', error);
                    return null;
                }
            }

            async updateUserSettings(settings) {
                try {
                    const { data, error } = await supabase
                        .from('users')
                        .update({ settings })
                        .eq('id', this.user.id)
                        .select()
                        .single();

                    if (error) throw error;
                    return data;
                } catch (error) {
                    console.error('Update user settings error:', error);
                    throw error;
                }
            }

            // Invitation methods
            async generateInviteCode() {
                try {
                    const code = Math.random().toString(36).substring(2, 10).toUpperCase();
                    const expiresAt = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString();

                    const { data, error } = await supabase
                        .from('invitations')
                        .insert([{
                            code,
                            from_user_id: this.user.id,
                            expires_at: expiresAt,
                            used: false
                        }])
                        .select()
                        .single();

                    if (error) throw error;
                    return data;
                } catch (error) {
                    console.error('Generate invite error:', error);
                    throw error;
                }
            }

            async findInvitation(code) {
                try {
                    const { data, error } = await supabase
                        .from('invitations')
                        .select('*')
                        .eq('code', code.toUpperCase())
                        .eq('used', false)
                        .gt('expires_at', new Date().toISOString())
                        .single();

                    if (error && error.code !== 'PGRST116') throw error;
                    return data;
                } catch (error) {
                    console.error('Find invitation error:', error);
                    return null;
                }
            }

            async acceptInvitation(invitationId, code) {
                try {
                    // Start a transaction-like operation
                    const { data: invitation, error: inviteError } = await supabase
                        .from('invitations')
                        .select('*')
                        .eq('id', invitationId)
                        .eq('code', code.toUpperCase())
                        .eq('used', false)
                        .single();

                    if (inviteError) throw inviteError;

                    // Check if already connected
                    const { data: existingConnection } = await supabase
                        .from('connections')
                        .select('id')
                        .or('user1_id.eq.' + this.user.id + ',user2_id.eq.' + this.user.id)
                        .or('user1_id.eq.' + invitation.from_user_id + ',user2_id.eq.' + invitation.from_user_id)
                        .single();

                    if (existingConnection) {
                        throw new Error('Already connected to this user');
                    }

                    // Mark invitation as used
                    const { error: updateError } = await supabase
                        .from('invitations')
                        .update({
                            used: true,
                            used_at: new Date().toISOString(),
                            to_user_id: this.user.id
                        })
                        .eq('id', invitationId);

                    if (updateError) throw updateError;

                    // Create connection
                    const { data: connection, error: connectionError } = await supabase
                        .from('connections')
                        .insert([{
                            user1_id: invitation.from_user_id,
                            user2_id: this.user.id,
                            status: 'active'
                        }])
                        .select()
                        .single();

                    if (connectionError) throw connectionError;

                    return connection;
                } catch (error) {
                    console.error('Accept invitation error:', error);
                    throw error;
                }
            }

            // Connection methods
            async getUserConnections() {
                try {
                    const { data, error } = await supabase
                        .from('connections')
                        .select('*, user1:users!connections_user1_id_fkey(*), user2:users!connections_user2_id_fkey(*)')
                        .or('user1_id.eq.' + this.user.id + ',user2_id.eq.' + this.user.id)
                        .eq('status', 'active');

                    if (error) throw error;

                    // Transform data to get the other user's info
                    return data.map(connection => {
                        const otherUser = connection.user1_id === this.user.id 
                            ? connection.user2 
                            : connection.user1;
                        return {
                            id: otherUser.id,
                            name: otherUser.name,
                            email: otherUser.email,
                            connection_id: connection.id
                        };
                    });
                } catch (error) {
                    console.error('Get connections error:', error);
                    return [];
                }
            }

            async removeConnection(connectionId) {
                try {
                    const { error } = await supabase
                        .from('connections')
                        .delete()
                        .eq('id', connectionId);

                    if (error) throw error;
                    return true;
                } catch (error) {
                    console.error('Remove connection error:', error);
                    throw error;
                }
            }

            // Income methods
            async addIncome(incomeData) {
                try {
                    const { data, error } = await supabase
                        .from('incomes')
                        .insert([{
                            ...incomeData,
                            user_id: this.user.id
                        }])
                        .select()
                        .single();

                    if (error) throw error;
                    return data;
                } catch (error) {
                    console.error('Add income error:', error);
                    throw error;
                }
            }

            async getUserIncomes() {
                try {
                    const { data, error } = await supabase
                        .from('incomes')
                        .select('*')
                        .eq('user_id', this.user.id)
                        .order('created_at', { ascending: false });

                    if (error) throw error;
                    return data || [];
                } catch (error) {
                    console.error('Get incomes error:', error);
                    return [];
                }
            }

            async updateIncome(incomeId, updates) {
                try {
                    const { data, error } = await supabase
                        .from('incomes')
                        .update(updates)
                        .eq('id', incomeId)
                        .eq('user_id', this.user.id)
                        .select()
                        .single();

                    if (error) throw error;
                    return data;
                } catch (error) {
                    console.error('Update income error:', error);
                    throw error;
                }
            }

            async deleteIncome(incomeId) {
                try {
                    const { error } = await supabase
                        .from('incomes')
                        .delete()
                        .eq('id', incomeId)
                        .eq('user_id', this.user.id);

                    if (error) throw error;
                    return true;
                } catch (error) {
                    console.error('Delete income error:', error);
                    throw error;
                }
            }

            // Message methods for partner communication
            async sendMessage(toUserId, messageText, billId = null) {
                try {
                    const messageData = {
                        from_user_id: this.user.id,
                        to_user_id: toUserId,
                        message_text: messageText,
                        bill_id: billId,
                        read: false
                    };

                    const { data, error } = await supabase
                        .from('messages')
                        .insert([messageData])
                        .select()
                        .single();

                    if (error) throw error;
                    return data;
                } catch (error) {
                    console.error('Send message error:', error);
                    throw error;
                }
            }

            async getConversation(partnerId) {
                try {
                    const { data, error } = await supabase
                        .from('messages')
                        .select('*')
                        .or(`and(from_user_id.eq.${this.user.id},to_user_id.eq.${partnerId}),and(from_user_id.eq.${partnerId},to_user_id.eq.${this.user.id})`)
                        .order('created_at', { ascending: true });

                    if (error) throw error;
                    return data || [];
                } catch (error) {
                    console.error('Get conversation error:', error);
                    throw error;
                }
            }

            async getUnreadMessageCount() {
                try {
                    const { count, error } = await supabase
                        .from('messages')
                        .select('*', { count: 'exact', head: true })
                        .eq('to_user_id', this.user.id)
                        .eq('read', false);

                    if (error) throw error;
                    return count || 0;
                } catch (error) {
                    console.error('Get unread count error:', error);
                    return 0;
                }
            }

            async getRecentMessages() {
                try {
                    // Get all messages involving this user
                    const { data, error } = await supabase
                        .from('messages')
                        .select('*')
                        .or(`from_user_id.eq.${this.user.id},to_user_id.eq.${this.user.id}`)
                        .order('created_at', { ascending: false })
                        .limit(50);

                    if (error) throw error;

                    // Group by conversation partner and get latest message
                    const conversations = {};
                    data?.forEach(msg => {
                        const partnerId = msg.from_user_id === this.user.id ? msg.to_user_id : msg.from_user_id;
                        if (!conversations[partnerId] || new Date(msg.created_at) > new Date(conversations[partnerId].created_at)) {
                            conversations[partnerId] = msg;
                        }
                    });

                    // Sort by created_at descending (newest first)
                    return Object.values(conversations).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                } catch (error) {
                    console.error('Get recent messages error:', error);
                    return [];
                }
            }

            async markMessagesAsRead(partnerId) {
                try {
                    const { error } = await supabase
                        .from('messages')
                        .update({ read: true })
                        .eq('from_user_id', partnerId)
                        .eq('to_user_id', this.user.id)
                        .eq('read', false);

                    if (error) throw error;
                    return true;
                } catch (error) {
                    console.error('Mark messages as read error:', error);
                    throw error;
                }
            }

            // Attachment methods for receipts/images
            async uploadAttachment(billId, fileName, fileSize, mimeType, fileData) {
                try {
                    const attachmentData = {
                        user_id: this.user.id,
                        bill_id: billId,
                        file_name: fileName,
                        file_size: fileSize,
                        mime_type: mimeType,
                        file_data: fileData // Base64 encoded
                    };

                    const { data, error } = await supabase
                        .from('attachments')
                        .insert([attachmentData])
                        .select()
                        .single();

                    if (error) throw error;
                    return data;
                } catch (error) {
                    console.error('Upload attachment error:', error);
                    throw error;
                }
            }

            async getAttachments(billId) {
                try {
                    const { data, error } = await supabase
                        .from('attachments')
                        .select('*')
                        .eq('bill_id', billId)
                        .order('created_at', { ascending: true });

                    if (error) throw error;
                    return data || [];
                } catch (error) {
                    console.error('Get attachments error:', error);

            // FIXED: Improved bill completion logic
            async checkAndCompleteBill(billId) {
                try {
                    // Get bill and all its shares
                    const { data: bill, error: billError } = await supabase
                        .from('bills')
                        .select('*, bill_shares(*)')
                        .eq('id', billId)
                        .single();

                    if (billError) throw billError;

                    let isFullyPaid = false;

                    if (bill.bill_shares.length === 0) {
                        // Non-shared bill - only check creator_paid
                        isFullyPaid = bill.creator_paid;
                    } else {
                        // Shared bill - all shares must be paid
                        isFullyPaid = bill.bill_shares.every(share => share.paid);
                    }

                    if (isFullyPaid) {
                        // Mark entire bill as complete
                        const { error } = await supabase
                            .from('bills')
                            .update({
                                paid: true,
                                paid_date: new Date().toISOString()
                            })
                            .eq('id', billId);

                        if (error) throw error;

                        // Handle recurring bills
                        if (bill.recurring && bill.recurrence_interval) {
                            await this.createNextRecurringBill(bill);
                        }
                    }
                } catch (error) {
                    console.error('Check and complete bill error:', error);
                }
            }

            async createNextRecurringBill(originalBill) {
                try {
                    const currentDate = new Date(originalBill.due_date);
                    let nextDate = new Date(currentDate);

                    // Calculate next due date based on recurrence interval
                    switch (originalBill.recurrence_interval) {
                        case 'monthly':
                            nextDate.setMonth(nextDate.getMonth() + 1);
                            break;
                        case 'bi-monthly':
                            nextDate.setMonth(nextDate.getMonth() + 2);
                            break;
                        case 'quarterly':
                            nextDate.setMonth(nextDate.getMonth() + 3);
                            break;
                        case 'semi-annually':
                            nextDate.setMonth(nextDate.getMonth() + 6);
                            break;
                        case 'annually':
                            nextDate.setFullYear(nextDate.getFullYear() + 1);
                            break;
                    }

                    // Create new bill instance
                    const newBillData = {
                        user_id: originalBill.user_id,
                        name: originalBill.name,
                        amount: originalBill.amount,
                        due_date: nextDate.toISOString().split('T')[0],
                        category: originalBill.category,
                        description: originalBill.description,
                        recurring: true,
                        recurrence_interval: originalBill.recurrence_interval,
                        shared_with: originalBill.shared_with,
                        splits: originalBill.splits,
                        paid: false,
                        creator_paid: false
                    };

                    const { data: newBill, error } = await supabase
                        .from('bills')
                        .insert([newBillData])
                        .select()
                        .single();

                    if (error) throw error;

                    // Recreate bill shares if it was shared
                    if (originalBill.shared_with && originalBill.splits) {
                        const shares = Object.entries(originalBill.splits).map(([userId, amount]) => ({
                            bill_id: newBill.id,
                            user_id: userId,
                            amount: amount,
                            paid: false
                        }));

                        const { error: sharesError } = await supabase
                            .from('bill_shares')
                            .insert(shares);

                        if (sharesError) throw sharesError;
                    }

                    return newBill;
                } catch (error) {
                    console.error('Create next recurring bill error:', error);
                    throw error;
                }
            }

            // Calculate what the current user owes to others
            async calculateWhatIOwe() {
                try {
                    const bills = await this.getUserBills();
                    const expenses = await this.getUserExpenses();
                    const allItems = [...bills, ...expenses];

                    const iOweByPerson = {};

                    for (const item of allItems) {
                        if (item.is_shared && item.bill_shares) {
                            // Find the current user's share
                            const myShare = item.bill_shares.find(share => share.user_id === this.user.id);
                            
                            // If current user hasn't paid their share
                            if (myShare && !myShare.paid) {
                                // Find the creator of this bill/expense
                                const creatorId = item.user_id;
                                
                                // Get creator details
                                const { data: creator } = await supabase
                                    .from('users')
                                    .select('name')
                                    .eq('id', creatorId)
                                    .single();

                                const creatorName = creator?.name || 'Unknown';
                                
                                if (!iOweByPerson[creatorName]) {
                                    iOweByPerson[creatorName] = {
                                        total: 0,
                                        bills: 0,
                                        expenses: 0,
                                        userId: creatorId
                                    };
                                }
                                
                                iOweByPerson[creatorName].total += myShare.amount;
                                if (item.category === 'expense') {
                                    iOweByPerson[creatorName].expenses += myShare.amount;
                                } else {
                                    iOweByPerson[creatorName].bills += myShare.amount;
                                }
                            }
                        }
                    }

                    return iOweByPerson;
                } catch (error) {
                    console.error('Calculate what I owe error:', error);
                    return {};
                }
            }

                    targetDate.setDate(targetDate.getDate() + notificationDays);
                    
                    const bills = await this.getUserBills();
                    const upcomingBills = bills.filter(bill => {
                        if (bill.paid) return false;
                        
                        const dueDate = new Date(bill.due_date);
                        const today = new Date();
                        const daysDiff = Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));
                        
                        return daysDiff >= 0 && daysDiff <= notificationDays;
                    });

                    return upcomingBills.map(bill => {
                        const dueDate = new Date(bill.due_date);
                        const today = new Date();
                        const daysDiff = Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));
                        
                        let urgency = 'info';
                        if (daysDiff === 0) urgency = 'urgent';
                        else if (daysDiff === 1) urgency = 'warning';
                        
                        return {
                            ...bill,
                            days_until_due: daysDiff,
                            urgency
                        };
                    });
                } catch (error) {
                    console.error('Get upcoming notifications error:', error);
                    return [];
                }
            }

            // Utility methods
            async logTransaction(type, data) {
                try {
                    const { error } = await supabase
                        .from('transactions')
                        .insert([{
                            type,
                            data,
                            user_id: this.user.id
                        }]);

                    if (error) throw error;
                } catch (error) {
                    console.error('Log transaction error:', error);
                }
            }
        }

        // Initialize Supabase service
        const storage = new SupabaseService();

        // Enhanced Main App Class
        class SmartBudgetApp {
            constructor() {
                this.currentUser = null;
                this.currentView = 'login';
                this.activeTab = 'dashboard';
                this.privateMode = false;
                this.loading = false;
                this.receiptItems = [];
                this.messageChannel = null;
                this.notificationChannel = null;
                this.init();
            }

            async init() {
                const user = await storage.getCurrentUser();
                if (user) {
                    const profile = await storage.getUserProfile();
                    if (profile) {
                        this.currentUser = profile;
                        this.currentView = 'app';
                    }
                }
                
                this.render();
                this.attachEventListeners();
                window.app = this;
                
                // Setup real-time notifications if user is logged in
                if (this.currentUser) {
                    this.setupRealtimeNotifications();
                }
            }

            handleSignOut() {
                this.unsubscribeRealtimeNotifications();
                this.currentUser = null;
                this.currentView = 'login';
                this.render();
            }

            // Real-time Notification System
            setupRealtimeNotifications() {
                console.log('Setting up real-time notifications for:', this.currentUser.name);
                
                // Subscribe to new messages sent TO this user
                this.notificationChannel = supabase
                    .channel('user-notifications-' + this.currentUser.id)
                    .on('postgres_changes', 
                        { 
                            event: 'INSERT', 
                            schema: 'public', 
                            table: 'messages',
                            filter: 'receiver_id=eq.' + this.currentUser.id
                        },
                        async (payload) => {
                            console.log('📬 New message received in real-time!', payload);
                            
                            try {
                                // Get sender info
                                const { data: sender } = await supabase
                                    .from('users')
                                    .select('name')
                                    .eq('id', payload.new.sender_id)
                                    .single();
                                
                                const senderName = sender?.name || 'Someone';
                                const messageContent = payload.new.content || '';
                                
                                console.log('Message from:', senderName);
                                
                                // Update notification badge immediately
                                await this.updateNotificationBadge();
                                
                                // Trigger Android notification if in Android app
                                if (typeof AndroidBridge !== 'undefined') {
                                    console.log('🔔 Triggering Android notification');
                                    AndroidBridge.showNotification(
                                        '💬 ' + senderName,
                                        messageContent.substring(0, 100)
                                    );
                                } else {
                                    console.log('Not in Android app - skipping native notification');
                                }
                            } catch (error) {
                                console.error('Error handling new message notification:', error);
                            }
                        }
                    )
                    .subscribe((status) => {
                        console.log('Notification channel status:', status);
                        if (status === 'SUBSCRIBED') {
                            console.log('✅ Real-time notifications active!');
                        }
                    });
            }

            unsubscribeRealtimeNotifications() {
                if (this.notificationChannel) {
                    console.log('Unsubscribing from real-time notifications');
                    supabase.removeChannel(this.notificationChannel);
                    this.notificationChannel = null;
                }
            }

            attachEventListeners() {
                document.addEventListener('click', (e) => {
                    if (e.target.matches('[data-action]') || e.target.closest('[data-action]')) {
                        const element = e.target.matches('[data-action]') ? e.target : e.target.closest('[data-action]');
                        const action = element.dataset.action;
                        this.handleAction(action, element);
                    }
                });

                document.addEventListener('submit', (e) => {
                    if (e.target.matches('[data-form]')) {
                        e.preventDefault();
                        const formType = e.target.dataset.form;
                        this.handleFormSubmit(formType, new FormData(e.target));
                    }
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.closeModal();
                    }
                });
            }

            setLoading(isLoading) {
                this.loading = isLoading;
                const app = document.getElementById('app');
                app.classList.toggle('loading', isLoading);
            }

            async handleAction(action, element) {
                this.setLoading(true);
                
                try {
                    switch(action) {
                        case 'logout':
                            await storage.signOut();
                            break;
                        
                        case 'toggle-private':
                            this.privateMode = !this.privateMode;
                            this.render();
                            break;
                        
                        case 'switch-tab':
                            this.activeTab = element.dataset.tab;
                            // Show loading state
                            const mainArea = document.querySelector('.max-w-7xl.mx-auto.p-4');
                            if (mainArea) {
                                mainArea.innerHTML = '<div class="flex justify-center items-center py-12"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600"></div></div>';
                            }
                            await this.render();
                            break;
                        
                        case 'show-modal':
                            await this.showModal(element.dataset.modal, element.dataset.id);
                            // If opening notifications, update badge after modal opens
                            if (element.dataset.modal === 'notifications') {
                                setTimeout(async () => {
                                    await this.updateNotificationBadge();
                                }, 500);
                            }
                            break;
                        
                        case 'close-modal':
                            this.closeModal();
                            break;
                        
                        case 'mark-paid':
                            const isShared = element.dataset.shared === 'true';
                            const shareId = element.dataset.shareId;
                            await storage.markBillPaid(element.dataset.billId, isShared, shareId);
                            this.render();
                            break;
                        
                        case 'delete-income':
                            if (confirm('Are you sure you want to delete this income source?')) {
                                await storage.deleteIncome(element.dataset.incomeId);
                                this.render();
                            }
                            break;
                        
                        case 'delete-bill':
                            if (confirm('Are you sure you want to delete this bill?')) {
                                await storage.deleteBill(element.dataset.billId);
                                this.render();
                            }
                            break;
                        
                        case 'edit-bill':
                            await this.showModal('bill', element.dataset.billId);
                            break;
                        
                        case 'edit-expense':
                            await this.showModal('expense', element.dataset.expenseId);
                            break;

                        case 'remove-connection':
                            if (confirm('Remove this connection? This will also remove any shared bills.')) {
                                await storage.removeConnection(element.dataset.connectionId);
                                this.render();
                            }
                            break;
                        
                        case 'switch-to-signup':
                            document.getElementById('login-form').style.display = 'none';
                            document.getElementById('signup-form').style.display = 'block';
                            break;
                        
                        case 'switch-to-login':
                            document.getElementById('signup-form').style.display = 'none';
                            document.getElementById('login-form').style.display = 'block';
                            break;

                        case 'add-receipt-item':
                            this.addReceiptItem();
                            break;

                        case 'remove-receipt-item':
                            this.removeReceiptItem(parseInt(element.dataset.index));
                            break;
                        
                        case 'open-chat':
                            await this.showModal('chat', element.dataset.partnerId);
                            // Update badge after opening chat (marks messages as read)
                            setTimeout(async () => {
                                await this.updateNotificationBadge();
                            }, 500);
                            break;
                        
                        case 'view-attachment':
                            this.viewAttachment(element.dataset.attachmentData, element.dataset.attachmentName);
                            break;
                        
                        case 'delete-attachment':
                            if (confirm('Delete this attachment?')) {
                                await storage.deleteAttachment(element.dataset.attachmentId);
                                this.render();
                            }
                            break;
                    }
                } catch (error) {
                    this.showError(error.message || 'An error occurred');
                } finally {
                    this.setLoading(false);
                }
            }

            addReceiptItem() {
                this.receiptItems.push({ name: '', amount: 0 });
                this.updateReceiptItemsDisplay();
            }

            removeReceiptItem(index) {
                this.receiptItems.splice(index, 1);
                this.updateReceiptItemsDisplay();
            }

            updateReceiptItemsDisplay() {
                const container = document.getElementById('receipt-items');
                if (!container) return;

                let total = 0;
                let itemsHTML = '';

                this.receiptItems.forEach((item, index) => {
                    total += parseFloat(item.amount) || 0;
                    itemsHTML += `
                        <div class="receipt-item">
                            <input type="text" placeholder="Item name" value="${item.name}" 
                                   onchange="window.app.updateReceiptItem(${index}, 'name', this.value)">
                            <input type="number" placeholder="0.00" step="0.01" value="${item.amount}"
                                   onchange="window.app.updateReceiptItem(${index}, 'amount', this.value)">
                            <button type="button" data-action="remove-receipt-item" data-index="${index}">Remove</button>
                        </div>
                    `;
                });

                container.innerHTML = itemsHTML;
                
                const totalDisplay = document.getElementById('total-amount');
                if (totalDisplay) {
                    totalDisplay.textContent = `Total: $${total.toFixed(2)}`;
                }

                // Update hidden total input
                const totalInput = document.querySelector('input[name="totalAmount"]');
                if (totalInput) {
                    totalInput.value = total.toFixed(2);
                }
                
                // Update split preview when total changes
                if (window.updateExpenseSplitPreview) {
                    window.updateExpenseSplitPreview();
                }
            }

            updateReceiptItem(index, field, value) {
                if (this.receiptItems[index]) {
                    this.receiptItems[index][field] = field === 'amount' ? parseFloat(value) || 0 : value;
                    this.updateReceiptItemsDisplay();
                }
            }

                                this.currentView = 'app';

                        case 'notification-settings':

                            const updatedSettings = {

                        case 'send-message':

                                const peopleCount = selectedPeople.length + 1; // +1 for creator
                                
                                if (splitType === 'equal') {
                                    const perPerson = billData.amount / peopleCount;
                                    billData.splits[this.currentUser.id] = perPerson;
                                    selectedPeople.forEach(personId => {

                                } else if (splitType === 'percentage') {

                            this.closeModal();

                                const splitType = expenseForm.querySelector('input[name="splitType"]:checked')?.value || 'equal';

                                if (splitType === 'equal') {
                                    const perPerson = expenseData.totalAmount / peopleCount;
                                    expenseData.splits[this.currentUser.id] = perPerson;
                                    selectedPeople.forEach(personId => {
                                        expenseData.splits[personId] = perPerson;
                                    });
                                } else if (splitType === 'custom') {
                                    const userAmount = parseFloat(data.userAmount) || 0;
                                    expenseData.splits[this.currentUser.id] = userAmount;
                                    
                                    selectedPeople.forEach(personId => {
                                        const amountInput = expenseForm.querySelector(`input[name="custom-${personId}"]`);
                                        const amount = parseFloat(amountInput?.value || 0);
                                        expenseData.splits[personId] = amount;
                                    });
                                    
                                    // Validate total
                                    const splitTotal = Object.values(expenseData.splits).reduce((sum, amt) => sum + amt, 0);
                                    if (Math.abs(splitTotal - expenseData.totalAmount) >= 0.01) {
                                        throw new Error('Custom amounts must equal the total expense amount');
                                    }
                                } else if (splitType === 'percentage') {
                                    const userPercentage = parseFloat(data.userPercentage) || 0;
                                    expenseData.splits[this.currentUser.id] = (expenseData.totalAmount * userPercentage / 100);
                                    
                                    let totalPercentage = userPercentage;
                                    selectedPeople.forEach(personId => {
                                        const percentInput = expenseForm.querySelector(`input[name="percentage-${personId}"]`);
                                        const percent = parseFloat(percentInput?.value || 0);
                                        totalPercentage += percent;
                                        expenseData.splits[personId] = (expenseData.totalAmount * percent / 100);

                                    // Validate percentage total

            showError(message) {
                const toast = document.createElement('div');
                toast.className = 'fixed top-4 right-4 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg z-50 fade-in';
                toast.textContent = message;
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.remove();
                }, 3000);
            }

            showSuccess(message) {
                const toast = document.createElement('div');
                toast.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg z-50 fade-in';
                toast.textContent = message;
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.remove();
                }, 4000);
            }

            async showModal(modalType, itemId = null) {
                const modalContent = await this.getModalContent(modalType, itemId);
                const modal = document.createElement('div');
                modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 fade-in';
                modal.innerHTML = '<div class="glass rounded-2xl p-6 w-full max-w-md max-h-screen overflow-y-auto">' + modalContent + '</div>';
                document.body.appendChild(modal);
                
                setTimeout(() => {
                    const firstInput = modal.querySelector('input, select, textarea');
                    if (firstInput) firstInput.focus();
                    
                    // Update receipt items display if expense modal
                    if (modalType === 'expense' && this.receiptItems.length > 0) {
                        this.updateReceiptItemsDisplay();
                    }
                    
                    // Scroll to bottom and set up auto-refresh if chat modal
                    if (modalType === 'chat') {
                        const chatMessages = document.getElementById('chat-messages');
                        if (chatMessages) {
                            chatMessages.scrollTop = chatMessages.scrollHeight;

                        // Auto-refresh chat messages only (not the whole modal) every 3 seconds

                            const currentScroll = currentChatMessages.scrollTop;
                            const isAtBottom = currentChatMessages.scrollHeight - currentChatMessages.scrollTop <= currentChatMessages.clientHeight + 50;
                            
                            // Get updated messages

            // FIXED: Enhanced getBillStatus to handle all payment scenarios correctly
            getBillStatus(bill) {
                if (bill.paid) {
                    return { status: 'Complete', class: 'status-complete' };
                }

                if (bill.is_shared) {
                    // For shared bills, check if current user has paid their share
                    if (bill.user_paid) {
                        return { status: 'Waiting for others', class: 'status-waiting-others' };
                    } else {
                        return { status: 'Waiting for you', class: 'status-waiting-you' };
                    }
                } else {
                    // For non-shared bills, check creator payment
                    if (bill.creator_paid) {
                        return { status: 'Complete', class: 'status-complete' };
                    } else {
                        return { status: 'Pending', class: 'status-pending' };
                    }
                }
            }

                    '<div class="text-xs font-medium text-gray-600 mb-2">Split Details:</div>';

                splitHTML += `<div class="split-item current-user">

            async calculateTotals() {
                const incomes = await storage.getUserIncomes();
                const bills = await storage.getUserBills();
                const expenses = await storage.getUserExpenses();
                
                let monthlyIncome = 0;
                incomes.forEach(income => {
                    switch(income.frequency) {
                        case 'weekly': monthlyIncome += income.amount * 4.33; break;
                        case 'bi-weekly': monthlyIncome += income.amount * 2.17; break;
                        case 'monthly': monthlyIncome += income.amount; break;
                        case 'one-time': monthlyIncome += income.amount / 12; break;
                    }
                });
                
                let monthlyBills = 0;
                bills.forEach(bill => {
                    if (!bill.paid) {
                        if (bill.user_share) {
                            monthlyBills += bill.user_share;
                        } else {
                            monthlyBills += bill.amount;
                        }
                    }
                });

                let pendingExpenses = 0;
                expenses.forEach(expense => {
                    if (!expense.paid) {
                        if (expense.user_share) {
                            pendingExpenses += expense.user_share;
                        } else {
                            pendingExpenses += expense.amount;
                        }
                    }
                });
                
                return {
                    income: monthlyIncome,
                    bills: monthlyBills,
                    expenses: pendingExpenses,
                    remaining: monthlyIncome - monthlyBills - pendingExpenses
                };
            }

        // Helper functions for dynamic UI
        function formatMessageTimestamp(dateString) {
            const messageDate = new Date(dateString);
            const now = new Date();
            const diffMs = now - messageDate;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            // Now - under 1 minute
            if (diffMins < 1) {
                return 'Now';
            }
            // X mins ago - under 1 hour
            else if (diffMins < 60) {
                return diffMins + ' min' + (diffMins > 1 ? 's' : '') + ' ago';
            }
            // X hrs ago - under 24 hours
            else if (diffHours < 24) {
                return diffHours + ' hr' + (diffHours > 1 ? 's' : '') + ' ago';
            }
            // Yesterday
            else if (diffDays === 1) {
                return 'Yesterday';
            }
            // Day name for this week (last 7 days)
            else if (diffDays < 7) {
                const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                return days[messageDate.getDay()];
            }
            // Full date for older
            else {
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                return months[messageDate.getMonth()] + ' ' + messageDate.getDate() + ', ' + messageDate.getFullYear();
            }
        }

            if (e.target.name === 'splitType') {
                const customSplit = document.getElementById('custom-split');
                const percentageSplit = document.getElementById('percentage-split');
                
                if (customSplit && percentageSplit) {
                    customSplit.style.display = e.target.value === 'custom' ? 'block' : 'none';
                    percentageSplit.style.display = e.target.value === 'percentage' ? 'block' : 'none';
                }
            }
        });

        // Initialize app after DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const app = new SmartBudgetApp();
                
                // Update receipt items display after modal loads
                setTimeout(() => {
                    if (window.app && window.app.updateReceiptItemsDisplay) {
                        window.app.updateReceiptItemsDisplay();
                    }
                }, 500);
            }, 100);
        });
    </script>
</body>
</html>
